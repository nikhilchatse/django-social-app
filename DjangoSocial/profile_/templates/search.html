<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/dark-theme.css' %}" rel="stylesheet">
    <title>Search Results</title>
</head>
<body>
    {% include "nav.html" %}
    <div class="container mt-4">
        <h1 class="text-center">Search Results</h1>
        {% if results %}
        <ul class="list-group">
        {% for post in results %}
            <li class="list-group-item">{{ post.title }}</li>
        {% endfor %}
        </ul>
        {% else %}
        <div class="alert alert-warning" role="alert">
            No results found for "{{ query }}".
        </div>
        {% endif %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
