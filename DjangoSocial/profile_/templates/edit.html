{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Edit Profile | Django Social</title>
</head>

<body class="bg-[#0f172a] text-slate-200 font-sans antialiased min-h-screen">
    {% include "nav.html" %}

    <main class="max-w-2xl mx-auto py-16 px-4">
        <div
            class="bg-[#1e293b]/60 border border-slate-700/50 rounded-[2.5rem] p-8 sm:p-12 shadow-2xl backdrop-blur-xl">
            <header class="text-center mb-10">
                <h1 class="text-3xl font-black text-slate-100 italic">Edit Your Profile</h1>
                <p class="text-slate-400 mt-2">Personalize your social presence</p>
            </header>

            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Display
                            Name</label>
                        <input type="text" value="{{edit.name}}" name="name"
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-3 px-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500/50 transition-all">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Email
                            Address</label>
                        <input type="email" value="{{edit.email}}" name="email"
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-3 px-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500/50 transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Contact
                        Number</label>
                    <input type="text" value="{{edit.contact}}" name="contact"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-3 px-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500/50 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Your Bio</label>
                    <textarea name="bio" rows="3"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-3 px-4 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500/50 transition-all resize-none">{{edit.bio}}</textarea>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Profile
                        Picture</label>
                    <div class="relative group">
                        <input type="file" name="image"
                            class="w-full bg-slate-800/50 border border-slate-700 border-dashed rounded-2xl py-8 px-4 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer transition-all">
                    </div>
                </div>

                <div class="pt-6 flex gap-4">
                    <a href="/profile"
                        class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-2xl text-center transition-all">
                        Cancel
                    </a>
                    <button type="submit"
                        class="flex-[2] bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
