{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    {% include "nav.html" %}
        <div class="msg-container col-4 ">
            {% for msg in messages %}
            {% if msg %}
                <div class="alert alert-success" role="alert">
                            {{msg}}
                </div>
            {% endif %}
        {% endfor %}
        </div>
        <div class="container col-6 shadow card p-4 my-5">
               <h1 class="text-center">login</h1>
        <form method="post">
            {% csrf_token %}
                <div class="mb-3">
                    <label  class="form-label">Username</label>
                    <input type="text" name="username" class="form-control"  aria-describedby="emailHelp">
                    
                </div>
                <div class="mb-3">
                    <label  class="form-label">Password</label>
                    <input type="text"name="password" class="form-control"  aria-describedby="emailHelp">
                </div>
                
                
                <button type="submit" class="btn btn-success">Submit</button>
        </form>
        <p class="text-center">Dont Have Account Register <a class="btn btn-primary" href="/register">Register</a></p>
        <p class="text-center">Forget Password ? <a class="btn btn-primary" href="/forgetPass">Change</a></p>
    </div>
</body>
</html>
