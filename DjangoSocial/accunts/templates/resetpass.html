{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Change Password | Django Social</title>
</head>

<body class="bg-[#0f172a] text-slate-200 font-sans antialiased min-h-screen flex flex-col">
    {% include "nav.html" %}

    <main class="flex-1 flex items-center justify-center p-6">
        <div
            class="w-full max-w-md bg-[#1e293b]/60 border border-slate-700/50 rounded-[2.5rem] p-8 sm:p-12 shadow-2xl backdrop-blur-xl">
            <header class="text-center mb-10">
                <div class="inline-flex p-4 bg-indigo-500/10 rounded-full mb-6">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-black text-slate-100 italic">Change Password</h1>
                <p class="text-slate-400 mt-2">Secure your account by updating your password.</p>
            </header>

            {% if messages %}
            <div class="mb-8 space-y-3">
                {% for msg in messages %}
                <div
                    class="flex items-center p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 shadow-xl backdrop-blur-md">
                    <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="text-sm font-medium">{{msg}}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div class="space-y-2">
                    <label
                        class="block text-sm font-bold text-slate-400 uppercase tracking-widest ml-1">Username</label>
                    <input type="text" name="username" required
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-4 px-5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/50 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-400 uppercase tracking-widest ml-1">Old
                        Password</label>
                    <input type="password" name="oldpassword" required
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-4 px-5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/50 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-400 uppercase tracking-widest ml-1">New
                        Password</label>
                    <input type="password" name="newpassword" required
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl py-4 px-5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500/50 transition-all">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-black py-4 rounded-2xl shadow-xl shadow-indigo-500/20 transition-all transform hover:scale-[1.02] active:scale-[0.98] mt-4">
                    Change password
                </button>
            </form>

            <footer class="text-center pt-8">
                <a href="/profile" class="text-sm font-bold text-slate-400 hover:text-slate-200 transition-colors">
                    Cancel and Return
                </a>
            </footer>
        </div>
    </main>
</body>

</html>
