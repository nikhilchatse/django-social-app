{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Create Post | Django Social</title>
</head>

<body class="bg-[#0f172a] text-slate-200 font-sans antialiased min-h-screen">
    {% include "nav.html" %}

    <main class="max-w-7xl mx-auto px-4 py-12 flex justify-center">
        <!-- Composer Card -->
        <div
            class="w-full max-w-lg bg-[#1e293b]/50 border border-slate-700/50 rounded-3xl shadow-2xl backdrop-blur-xl overflow-hidden">
            <header class="p-6 border-b border-slate-700/50 flex items-center justify-between">
                <h1 class="text-xl font-bold text-slate-100">Create Post</h1>
                <button type="button" onclick="window.history.back()"
                    class="text-slate-400 hover:text-slate-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </header>

            <!-- Messages -->
            {% if messages %}
            <div class="px-6 pt-4">
                {% for msg in messages %}
                <div
                    class="flex items-center p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 shadow-xl">
                    <span class="text-sm font-medium">{{msg}}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="p-6 space-y-4">
                {% csrf_token %}

                <!-- Avatar & Textarea Area -->
                <div class="flex gap-4">
                    <div class="flex-shrink-0">
                        <div
                            class="w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">
                            {{ request.user.username|slice:":1"|upper }}
                        </div>
                    </div>
                    <div class="flex-1">
                        <textarea name="captions" id="post-textarea" rows="3"
                            class="w-full bg-transparent border-none focus:ring-0 text-lg text-slate-100 placeholder-slate-500 resize-none min-h-[120px]"
                            placeholder="What's on your mind?"></textarea>
                    </div>
                </div>

                <!-- Image Preview Container (Hidden by default) -->
                <div id="image-preview-container"
                    class="relative rounded-2xl overflow-hidden bg-slate-800/50 hidden group">
                    <img id="image-preview" src="#" alt="Preview" class="w-full h-auto max-h-[400px] object-cover">
                    <button type="button" id="remove-image"
                        class="absolute top-3 right-3 p-2 bg-slate-900/80 text-white rounded-full hover:bg-slate-900 transition-all opacity-0 group-hover:opacity-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Toolbelt Area -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-700/50">
                    <div class="flex items-center gap-2">
                        <!-- Custom File Input Button -->
                        <button type="button" id="upload-btn"
                            class="flex items-center gap-2 px-4 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 rounded-full font-bold transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span>Photo</span>
                        </button>
                        <input type="file" name="postimg" id="file-input" class="hidden" accept="image/*">
                    </div>

                    <button type="submit"
                        class="px-8 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-full shadow-lg shadow-indigo-600/20 transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        Post
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const previewContainer = document.getElementById('image-preview-container');
        const previewImage = document.getElementById('image-preview');
        const removeBtn = document.getElementById('remove-image');
        const textarea = document.getElementById('post-textarea');

        // Trigger file input
        uploadBtn.addEventListener('click', () => fileInput.click());

        // Handle image selection/preview
        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Remove selected image
        removeBtn.addEventListener('click', () => {
            fileInput.value = '';
            previewContainer.classList.add('hidden');
            previewImage.src = '#';
        });

        // Auto-expand textarea
        textarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>

</html>
