{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/dark-theme.css' %}" rel="stylesheet">
    <title>Create Post</title>
</head>
<body>
     <div class="container col-6 shadow card p-4 my-5">
               <h1 class="text-center">Create Post</h1>
                <div class="msg-container col-4 ">
            {% for msg in messages %}
            {% if msg %}
                <div class="alert alert-success" role="alert">
                            {{msg}}
                </div>
            {% endif %}
        {% endfor %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
                 <div class="mb-3">
                    <label  class="form-label">Image</label>
                    <input type="FILE"  name="postimg" class="form-control"  >
                    
                </div>
             <div class="form-floating">
                <textarea class="form-control" name="captions" placeholder="Write Caption here"></textarea>
                <label for="floatingTextarea">Add a Caption...</label>
            </div>
                
                
                <button type="submit" class="btn btn-success my-3">Share</button>
        </form>
        
    </div>
</body>
</html>
